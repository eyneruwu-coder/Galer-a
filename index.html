<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Galería</title>
  <meta name="description" content="Galería instalable: mira, comparte y organiza tus fotos y videos.">
  <meta name="theme-color" content="#0E1013">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Galería">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css?v=1">
  <script>
    // Si algo falla al iniciar, la app limpia su propia caché una vez y se recarga sola.
    window.addEventListener("error", function (e) {
      if (window.__appReady) return;
      try {
        if (!sessionStorage.getItem("galHeal")) {
          sessionStorage.setItem("galHeal", "1");
          var jobs = [];
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
            jobs.push(navigator.serviceWorker.getRegistration("./").then(function (r) { return r && r.unregister(); }));
          }
          if (window.caches) {
            jobs.push(caches.keys().then(function (ks) {
              return Promise.all(ks.filter(function (k) { return k.indexOf("galeria-") === 0; }).map(function (k) { return caches.delete(k); }));
            }));
          }
          Promise.all(jobs).then(function () { location.reload(); }, function () { location.reload(); });
          return;
        }
      } catch (x) {}
      var d = document.createElement("div");
      d.style.cssText = "position:fixed;top:0;right:0;bottom:0;left:0;z-index:99;background:#0E1013;color:#ECEFF4;padding:24px;font:16px/1.5 sans-serif;overflow:auto";
      d.textContent = "Error al iniciar: " + (e.message || "desconocido") + " (" + String(e.filename || "").split("/").pop() + ":" + e.lineno + ")";
      document.body.appendChild(d);
    });
  </script>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-select" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></symbol>
  </defs>
</svg>

<div id="app">
  <header id="topbar">
    <div class="titlebox"><h1>Galería</h1><p id="summary"></p></div>
    <span class="spacer"></span>
    <button id="btnInstall" class="btn small primary" hidden>Instalar</button>
    <button id="btnImport" class="ibtn" aria-label="Importar fotos y videos"><svg class="ic"><use href="#i-plus"/></svg></button>
    <button id="btnSelect" class="ibtn" aria-label="Seleccionar"><svg class="ic"><use href="#i-select"/></svg></button>
  </header>

  <header id="selbar" hidden>
    <button id="btnSelClose" class="ibtn flat" aria-label="Cancelar selección"><svg class="ic"><use href="#i-close"/></svg></button>
    <h1 id="selCount">0 seleccionados</h1>
    <span class="spacer"></span>
    <button id="btnSelAll" class="btn small">Todo</button>
  </header>

  <nav class="chips" aria-label="Filtro">
    <button data-filter="all" aria-pressed="true">Todo</button>
    <button data-filter="photo" aria-pressed="false">Fotos</button>
    <button data-filter="video" aria-pressed="false">Videos</button>
  </nav>

  <main id="scroller">
    <div id="grid"></div>
    <div id="empty" hidden>
      <svg class="ic big"><use href="#i-image"/></svg>
      <h2>Aún no hay nada aquí</h2>
      <p>Las fotos y videos de la cámara aparecen solos. También puedes traer los que ya tengas en el teléfono.</p>
      <button id="btnImport2" class="btn primary">Importar del teléfono</button>
    </div>
  </main>

  <div id="selActions" hidden>
    <button id="actSave" class="act"><svg class="ic"><use href="#i-download"/></svg>Guardar</button>
    <button id="actShare" class="act"><svg class="ic"><use href="#i-share"/></svg>Compartir</button>
    <button id="actDelete" class="act danger"><svg class="ic"><use href="#i-trash"/></svg><span>Eliminar</span></button>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
</div>

<dialog id="viewer" aria-label="Visor">
  <div class="vbar">
    <button class="ibtn" id="viewClose" aria-label="Cerrar visor"><svg class="ic"><use href="#i-close"/></svg></button>
    <div class="vinfo"><span id="viewCount"></span><small id="viewName"></small></div>
  </div>
  <div id="viewStage"><div id="viewTrack"></div></div>
  <div class="actions">
    <button id="vSave" class="act"><svg class="ic"><use href="#i-download"/></svg>Guardar</button>
    <button id="vShare" class="act"><svg class="ic"><use href="#i-share"/></svg>Compartir</button>
    <button id="vDelete" class="act danger"><svg class="ic"><use href="#i-trash"/></svg><span>Eliminar</span></button>
  </div>
</dialog>

<input type="file" id="picker" accept="image/*,video/*" multiple hidden>
<script src="app.js?v=1"></script>
</body>
</html>
